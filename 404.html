<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Still Gift</title>
  <style>
    :root{--ink:#23384f;--warm:#9a7246;--paper:#f7f1e8}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:28px;background:linear-gradient(rgba(247,241,232,.86),rgba(247,241,232,.94)),url('assets/hero.jpg') center/cover;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
    main{width:min(100%,460px);padding:38px 30px;border-radius:28px;background:rgba(255,253,249,.91);box-shadow:0 16px 48px rgba(35,56,79,.13);text-align:center}
    .mark{margin:0 auto 20px;width:62px;height:62px;display:grid;place-items:center;border-radius:50%;background:#fbf4e7;color:var(--warm);font-size:30px}
    h1{margin:0 0 14px;font:400 34px Georgia,"Times New Roman",serif}
    p{margin:0 0 24px;color:#59616a;line-height:1.58}
    a{display:block;padding:15px 20px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:650}
    small{display:block;margin-top:20px;line-height:1.5;color:#727981}
  </style>
</head>
<body>
  <main>
    <div class="mark">✦</div>
    <h1>A Journey has been shared with you.</h1>
    <p>Download Still, sign in with Apple, then return here and tap this gift link again.</p>
    <a id="download" href="https://apps.apple.com/app/id6805919051">Download Still</a>
    <small>After installing, return to this message and tap the gift link again.</small>
  </main>
</body>
</html>
